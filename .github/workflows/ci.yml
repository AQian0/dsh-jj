name: ci

# Push/PR quality gate for the documented pre-commit command (`pnpm test`).
#
# The repository is a pnpm project: `pnpm-lock.yaml` is committed, the static
# toolchain (vite-plus / tsc) lives in devDependencies, and the public DSH peer
# dependencies are installed by pnpm from the ranges declared in package.json.
# Tests exercise the real jj/git toolchain (nothing is mocked).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        # Actions are pinned to commit SHAs (verified against the `v6` tag via
        # `git ls-remote`); keep the `# v6 (vX.Y.Z)` comment in sync when upgrading.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (v6.1.0)

      - name: Set up pnpm
        # No `version` input: the action installs the exact `packageManager`
        # version pinned in package.json.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4 (v4.4.0)

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 (v6.5.0)
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        # Reproducible install from the committed pnpm-lock.yaml. DSH peer
        # dependencies come from the ranges in package.json (pnpm installs them).
        run: pnpm install --frozen-lockfile

      - name: Install Jujutsu (jj) for the test fixtures
        env:
          JJ_VERSION: '0.46.0'
          # SHA-256 of jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz, as published by
          # GitHub's release asset digest for
          # https://github.com/jj-vcs/jj/releases/expanded_assets/v0.46.0 and
          # re-verified locally by hashing the downloaded asset. jj 0.46.0 publishes
          # no SHA256SUMS asset, so this GitHub-displayed digest is the authoritative
          # checksum for the exact asset URL below. Bump it together with JJ_VERSION.
          JJ_TARBALL_SHA256: 'fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08'
        run: |
          archive="${RUNNER_TEMP}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JJ_TARBALL_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          actual="$("$HOME/.local/bin/jj" --version)"
          # Official release binaries report a git-hash suffix (e.g.
          # "jj 0.46.0-7d382314f94..."), so compare the version prefix only.
          case "${actual}" in
            "jj ${JJ_VERSION}"*)
              echo "jj version ok: ${actual}"
              ;;
            *)
              echo "::error::expected jj ${JJ_VERSION}..., got ${actual}"
              exit 1
              ;;
          esac

      - name: Run the documented pre-commit gate
        # `pnpm test` = `vp check --deny-warnings` (Oxfmt + Oxlint) + tsc
        # type-check + `node --test` against the real jj/git binaries;
        # build.test.ts builds lib/ as part of the run.
        run: pnpm test

      - name: Smoke-check the publishable tarball
        # release.yml asserts the full manifest; this catches a broken `files`
        # config without spending network time (lib/ was just built by the tests).
        # `--ignore-scripts` keeps prepack from rebuilding lib/ during the smoke check.
        run: |
          pnpm pack --dry-run --ignore-scripts --json > "${RUNNER_TEMP}/pack.json"
          node -e "
            const manifest = require(process.env.RUNNER_TEMP + '/pack.json');
            const packaged = new Set(manifest.files.map((entry) => entry.path));
            for (const required of ['lib/index.js', 'lib/types/index.d.ts', 'cordis.patch.yml', 'icon.svg']) {
              if (!packaged.has(required)) {
                console.error('::error::publishable tarball is missing ' + required);
                process.exit(1);
              }
            }
            console.log('tarball smoke check passed (' + manifest.files.length + ' entries)');
          "
