name: release

# 推 v<version> tag 触发：校验 tag 与 package.json 版本一致、tag 提交在 main 上 →
# 跑文档门禁 `pnpm test`（vp check 的 Oxfmt/Oxlint + tsc 类型检查 + node --test，
# build.test.ts 负责构建 lib/）→ 显式 `pnpm run build` → 校验 pnpm pack 内容 →
# 用 npm 可信发布（GitHub OIDC，无需 NPM_TOKEN）发布，provenance 自动生成 →
# 创建 GitHub Release（已存在则跳过，可用 workflow_dispatch 传已有 tag 重跑）。
# 首次发布由本机 Bun 手动完成（Bun 不支持 npm OIDC）。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        # 有意不写具体版本号：格式示例保持与版本无关，发版时无需修改此处。
        description: 'Existing release tag to publish (format: vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # `environment: npm-release` 只有在 GitHub 仓库 Settings → Environments 中配置了
    # required reviewers（以及需要的分支/tag 规则）后才真正提供人工审批保护；未配置时
    # 它等价于普通 job。审批发生在整个 job 开始之前，因此它保护的是“是否允许用该 tag
    # 执行发布”，而不是发布步骤本身。
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged commit
        # Actions are pinned to commit SHAs (verified against the `v6` tag via
        # `git ls-remote`); keep the `# v6 (vX.Y.Z)` comment in sync when upgrading.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (v6.1.0)
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up pnpm
        # No `version` input: the action installs the exact `packageManager`
        # version pinned in package.json.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4 (v4.4.0)

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 (v6.5.0)
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        # Reproducible install from the committed pnpm-lock.yaml. The lockfile
        # pins the resolved DSH upstream tree (including the test-only
        # @deepseek-ai/dsh-session-projection type dependency), so no dynamic
        # version probe is needed. Upgrading that tree is a dependency change:
        # refresh the devDependency + lockfile with `pnpm install` and re-check
        # `pnpm peers check` instead of patching versions in this workflow.
        run: pnpm install --frozen-lockfile

      - name: Install Jujutsu (jj) for the test fixtures
        env:
          JJ_VERSION: '0.46.0'
          # SHA-256 of jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz, as published by
          # GitHub's release asset digest for
          # https://github.com/jj-vcs/jj/releases/expanded_assets/v0.46.0 and
          # re-verified locally by hashing the downloaded asset. jj 0.46.0 publishes
          # no SHA256SUMS asset, so this GitHub-displayed digest is the authoritative
          # checksum for the exact asset URL below. Bump it together with JJ_VERSION.
          JJ_TARBALL_SHA256: 'fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08'
        run: |
          archive="${RUNNER_TEMP}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JJ_TARBALL_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          actual="$("$HOME/.local/bin/jj" --version)"
          # Official release binaries report a git-hash suffix (e.g.
          # "jj 0.46.0-7d382314f94..."), so compare the version prefix only.
          case "${actual}" in
            "jj ${JJ_VERSION}"*)
              echo "jj version ok: ${actual}"
              ;;
            *)
              echo "::error::expected jj ${JJ_VERSION}..., got ${actual}"
              exit 1
              ;;
          esac

      - name: Verify tag and package metadata
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${version}" \
            || { echo "::error::tag ${RELEASE_TAG} does not match package.json ${version}"; exit 1; }
          node -e "const p = require('./package.json'); \
            if (p.private === true) throw new Error('package.json is private'); \
            if (!p.repository?.url) throw new Error('repository.url is required for trusted publishing')"

      - name: Verify the tag commit is on main
        # tag 必须落在 main 的祖先链上：workflow_dispatch 允许用旧 tag 重跑，但从未
        # 合入 main 的提交通不过这一步（这是有意设计）。checkout 是 detached HEAD，
        # 所以显式抓取 origin/main 再比较。
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::${RELEASE_TAG} points at a commit that is not on main"
            exit 1
          fi
          echo "${RELEASE_TAG} is on main"

      - name: Run the documented test gate
        # `pnpm test` = vp check（Oxfmt + Oxlint，warning 视为失败）+ tsc -p
        # tsconfig.test.json + node --test；build.test.ts 会构建 lib/。
        run: pnpm test

      - name: Build the published output
        # lib/ 不入库。prepack 也会构建，但这里显式再构建一次，让下面的 pack
        # 校验与最终发布看到同一份确定的产物（tsc 构建 < 1s）。
        run: pnpm run build

      - name: Validate the publishable tarball
        # 用 --ignore-scripts 防止再次触发 prepack；缺失 lib/types 或 locale 的包
        # 对该版本不可挽回，所以显式断言内容而不是只信 package.json.files。
        run: |
          pnpm pack --dry-run --ignore-scripts --json > "${RUNNER_TEMP}/pack.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pack.json`, 'utf8'));
          const packaged = new Set(manifest.files.map((entry) => entry.path));
          const required = [
            'lib/index.js',
            'lib/types/index.d.ts',
            'cordis.patch.yml',
            'icon.svg',
            'locale/en.json',
            'locale/zh.json',
            'tools/locale/en.json',
            'tools/locale/zh.json',
            'guard/locale/en.json',
            'guard/locale/zh.json',
          ];
          const missing = required.filter((path) => !packaged.has(path));
          if (missing.length > 0) {
            console.error(`::error::publishable tarball is missing: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`pnpm pack contains all ${required.length} required files (${manifest.files.length} entries)`);
          NODE

      - name: Publish to npm with OIDC
        # 已发布则跳过（warning），使重跑可恢复；prerelease 走 next dist-tag。
        # 发布本身仍走 npm 的 trusted publishing（OIDC），pnpm 只负责本地工具链。
        run: |
          version="${RELEASE_TAG#v}"
          if npm view "@aqian0/dsh-jj@${version}" version >/dev/null 2>&1; then
            echo "::warning::@aqian0/dsh-jj@${version} already published; skipping npm publish"
            exit 0
          fi
          if [[ "${version}" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        # Release 已存在则跳过；prerelease tag 自动标记 --prerelease。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "${RELEASE_TAG}")
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${args[@]}"
